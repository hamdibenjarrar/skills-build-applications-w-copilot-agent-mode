<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" aria-labelledby="title desc" role="img" viewBox="0 0 960 420"><title id="title">OctoFit Tracker three-tier architecture</title><desc id="desc">A deterministic diagram showing React presentation on port 5173 calling an Express API on port 8000, which reads and writes MongoDB on port 27017. Tests verify each tier and the integrated OctoFit capabilities.</desc><rect width="960" height="420" fill="#f6f8fa"/><text x="480" y="46" fill="#24292f" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">OctoFit Tracker architecture</text><g font-family="Arial, sans-serif"><rect width="240" height="180" x="60" y="110" fill="#ddf4ff" stroke="#0969da" stroke-width="3" rx="18"/><text x="180" y="150" fill="#0969da" font-size="22" font-weight="700" text-anchor="middle">Presentation tier</text><text x="180" y="185" fill="#24292f" font-size="17" text-anchor="middle">React 19 + Vite</text><text x="180" y="215" fill="#24292f" font-size="17" text-anchor="middle">React Router + Bootstrap</text><text x="180" y="245" fill="#24292f" font-size="17" text-anchor="middle">Port 5173</text><rect width="240" height="180" x="360" y="110" fill="#fff8c5" stroke="#9a6700" stroke-width="3" rx="18"/><text x="480" y="150" fill="#9a6700" font-size="22" font-weight="700" text-anchor="middle">Logic tier</text><text x="480" y="185" fill="#24292f" font-size="17" text-anchor="middle">Express + TypeScript</text><text x="480" y="215" fill="#24292f" font-size="17" text-anchor="middle">Validation + services</text><text x="480" y="245" fill="#24292f" font-size="17" text-anchor="middle">Port 8000</text><rect width="240" height="180" x="660" y="110" fill="#dafbe1" stroke="#1a7f37" stroke-width="3" rx="18"/><text x="780" y="150" fill="#1a7f37" font-size="22" font-weight="700" text-anchor="middle">Data tier</text><text x="780" y="185" fill="#24292f" font-size="17" text-anchor="middle">MongoDB + Mongoose</text><text x="780" y="215" fill="#24292f" font-size="17" text-anchor="middle">Schemas + seed data</text><text x="780" y="245" fill="#24292f" font-size="17" text-anchor="middle">Port 27017</text><path stroke="#57606a" stroke-width="4" marker-end="url(#arrow)" d="M305 200h50"/><path stroke="#57606a" stroke-width="4" marker-end="url(#arrow)" d="M605 200h50"/><text x="330" y="188" fill="#57606a" font-size="14" text-anchor="middle">HTTP /api</text><text x="630" y="188" fill="#57606a" font-size="14" text-anchor="middle">Mongoose</text><rect width="660" height="54" x="150" y="330" fill="#fff" stroke="#d0d7de" rx="12"/><text x="480" y="363" fill="#24292f" font-size="17" text-anchor="middle">Executable contracts: activity tracking, teams, leaderboard, workout suggestions</text></g><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="7" refY="3"><path fill="#57606a" d="M0,0 L0,6 L8,3 z"/></marker></defs></svg>